name: Build & Release

on:
  push:
    tags:
      - 'R*'

permissions:
  contents: write

env:
  APP_NAME: GiTool
  WIN_ASSET: GiTool_Setup.exe

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 校验标签与版本号
        shell: pwsh
        run: |
          $ver = $env:GITHUB_REF_NAME -replace '^R', ''
          $cfg = (Get-Content src\core\config.py -Raw |
            Select-String -Pattern 'APP_VERSION\s*=\s*"([^"]+)"').Matches.Groups[1].Value
          if (-not $cfg) {
            throw "未能在 src\core\config.py 中读取 APP_VERSION"
          }
          if ($cfg -ne $ver) {
            throw "config.py 的 APP_VERSION（$cfg）与标签 R$ver 不一致，请先提交版本号再打标签"
          }
          "VERSION=$ver" >> $env:GITHUB_ENV

      - name: 准备 Inno Setup 与简体中文语言文件
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          if (-not (Test-Path $iscc)) { throw "未找到 ISCC.exe（C:\Program Files (x86)\Inno Setup 6）" }
          Copy-Item "$env:GITHUB_WORKSPACE\.github\ci\windows\ChineseSimplified.isl" `
            "C:\Program Files (x86)\Inno Setup 6\Languages\ChineseSimplified.isl" -Force
          "ISCC=$iscc" >> $env:GITHUB_ENV

      - name: 安装依赖
        shell: pwsh
        run: python -m pip install --upgrade pip; pip install -r requirements.txt "nuitka==4.3.5"

      - name: Nuitka 打包（目录版）
        shell: pwsh
        run: |
          $ver = $env:VERSION
          $na = @(
            '-m', 'nuitka',
            '--standalone',
            '--assume-yes-for-downloads',
            '--windows-console-mode=disable',
            '--noinclude-pytest-mode=nofollow',
            '--noinclude-setuptools-mode=nofollow',
            '--noinclude-unittest-mode=nofollow',
            '--enable-plugin=pyside6',
            '--include-package=winrt',
            '--include-package-data=winrt',
            '--msvc=latest',
            '--jobs=4',
            '--remove-output',
            '--output-dir=.\dist',
            '--windows-icon-from-ico=icon.ico',
            '--include-data-file=icon.ico=icon.ico',
            '--company-name=Lisselde_E',
            '--product-name=GiTool',
            '--file-description=GiTool',
            "--product-version=$ver",
            "--file-version=$ver",
            '--copyright=Copyright (c) 2026 Lisselde_E',
            '.\GiTool.py'
          )
          python @na
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Inno Setup 编译安装包
        shell: pwsh
        run: |
          $iscc = $env:ISCC
          & $iscc /Qp `
            "/DMyAppVersion=$env:VERSION" `
            "/DMyAppSrcDir=$env:GITHUB_WORKSPACE\dist\GiTool.dist" `
            "/DMyOutputDir=$env:GITHUB_WORKSPACE\dist" `
            "/DMyLicenseFile=$env:GITHUB_WORKSPACE\LICENSE" `
            "/DMySetupIcon=$env:GITHUB_WORKSPACE\icon.ico" `
            ".github\ci\windows\gitool_setup.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/${{ env.WIN_ASSET }}
          if-no-files-found: error

  release:
    needs: build-windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: 发布 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          TITLE="GiTool_${GITHUB_REF_NAME}"
          ls -l dist
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" --title "$TITLE"
          else
            gh release create "$TAG" dist/* --title "$TITLE"
          fi
